name: bitx_mobile
description: BitX CEX Mobile Application
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # 状态管理
  flutter_riverpod: ^2.4.0
  
  # 网络
  web_socket_channel: ^2.4.0
  
  # 国际化
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  
  # UI 组件
  cupertino_icons: ^1.0.6
  
  # K线图表
  candlesticks: ^2.1.0
  
  # 本地存储
  shared_preferences: ^2.2.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # 代码检查
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

flutter_icons:
  android: "ic_launcher" 
  ios: true
  image_path: "assets/icons/icon.png"
  
  # 资源文件（暂时注释，等有实际资源文件时再启用）
  assets:
  #   - assets/images/
    - assets/icons/
  
  # 字体
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700

